services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eron-portfolio

    ports:
      - "8081:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    restart: unless-stopped
