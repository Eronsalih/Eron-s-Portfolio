name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  test-artifact:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Show artifact files
        run: |
          echo "Artifact contents:"
          ls -la dist
          ls -la dist/assets || true

      - name: Test artifact
        run: |
          if [ -f "dist/index.html" ]; then
            echo "Artifact test passed - index.html exists"
          else
            echo "Artifact test failed - index.html missing"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs:
      - build
      - test-artifact

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/eronsalih/eron-s-portfolio:latest \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/eronsalih/eron-s-portfolio:latest
